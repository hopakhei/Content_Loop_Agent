name: POST — longform (manual)

# Publish one finished article from `longform/` word for word.
#
# Deliberately not on a schedule and deliberately not part of Loop 1. Loop 1
# reads Notion, picks a hook, composes an opening and appends a CTA — the right
# treatment for a framework draft and the wrong one for an article that is
# already written. This workflow only decides where to cut the text: one X post
# when it fits X_LONGPOST_LIMIT, a 500-character reply chain on Threads.
#
# Run it with dry_run first. The log prints every segment with its length, and
# the run stops before the network if re-joining the segments doesn't reproduce
# the file exactly.
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Article file (e.g. longform/2026-09-11-lean-stock-tree.md)"
        type: string
        required: true
      platforms:
        description: "Where to publish"
        type: choice
        options: ["X,Threads", "X", "Threads"]
        default: "X,Threads"
      dry_run:
        description: "Compose and print the segments without posting"
        type: boolean
        default: true

concurrency:
  group: loop-post          # never runs alongside the daily Loop 1 post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Publish
        run: |
          set -euo pipefail
          test -f "${{ inputs.path }}" || { echo "::error::No such article: ${{ inputs.path }}"; exit 1; }
          EXTRA=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then EXTRA="--dry-run"; fi
          python scripts/post_longform.py "${{ inputs.path }}" \
            --platforms "${{ inputs.platforms }}" $EXTRA
