name: Loop 1 — POST

# Cron is UTC. HKT = UTC+8, so the five HKT slots map to:
#   07:30 HKT -> 23:30 UTC (previous day)
#   10:00 HKT -> 02:00 UTC
#   12:30 HKT -> 04:30 UTC
#   18:30 HKT -> 10:30 UTC
#   21:30 HKT -> 13:30 UTC
# GitHub-hosted cron is best-effort and can be delayed a few minutes; the loop
# auto-detects the nearest slot from the current HKT time, so small drift is fine.
on:
  schedule:
    - cron: "30 23 * * *"
    - cron: "0 2 * * *"
    - cron: "30 4 * * *"
    - cron: "30 10 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulate without posting"
        type: boolean
        default: false
      slot:
        description: "Override slot (HH:MM, optional)"
        type: string
        default: ""

concurrency:
  group: loop-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_ARTICLE_LIBRARY_DB: "2089131e-0973-4b7d-8f10-3c39cef7a63f"
      NOTION_CONTENT_DRAFTS_DB: "216ebf08-3c4a-44fc-9467-a30bc12030a6"
      NOTION_PERFORMANCE_LOG_DB: "21e2c21c-b4ca-4d2f-823b-426f530e6fca"
      NOTION_POSTING_RULES_DB: "f10d0491-d1a8-4cd6-9e87-5f47f554cbe6"
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run Loop 1
        run: |
          EXTRA=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then EXTRA="$EXTRA --dry-run"; fi
          if [ -n "${{ inputs.slot }}" ]; then EXTRA="$EXTRA --slot ${{ inputs.slot }}"; fi
          python main.py --loop 1 --yes $EXTRA
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-log-${{ github.run_id }}
          path: logs/
          retention-days: 14
