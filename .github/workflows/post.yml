name: Loop 1 — POST

# One post a day, at 12:30 HKT -> 04:30 UTC.
#
# This used to fire five times a day (07:30, 10:00, 12:30, 18:30, 21:30 HKT).
# Two reasons it doesn't any more. Consumption: a framework takes a day to
# write and five slots eat five of them, so the ten-framework library drained
# in four days and X and Threads went silent twice. Quality: 12:30 measures
# 1.76% engagement against 0.71/0.61/0.47/0.24% for the rest, so four of every
# five posts were being spent on slots up to seven times worse.
#
# GitHub-hosted cron is best-effort and can be delayed a few minutes; the loop
# auto-detects the nearest slot from the current HKT time, so small drift is fine.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulate without posting"
        type: boolean
        default: false
      slot:
        description: "Override slot (HH:MM, optional)"
        type: string
        default: ""

concurrency:
  group: loop-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_ARTICLE_LIBRARY_DB: "2089131e-0973-4b7d-8f10-3c39cef7a63f"
      NOTION_CONTENT_DRAFTS_DB: "216ebf08-3c4a-44fc-9467-a30bc12030a6"
      NOTION_PERFORMANCE_LOG_DB: "21e2c21c-b4ca-4d2f-823b-426f530e6fca"
      NOTION_AGENT_RULES_DB: "4acdaa17-0e02-4aa6-988a-06927c905b96"
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run Loop 1
        run: |
          if [ -z "$NOTION_TOKEN" ] || [ -z "$X_API_KEY" ]; then
            echo "::notice::Secrets not configured (NOTION_TOKEN / X_API_KEY) — skipping scheduled POST. Add repo secrets to enable."
            exit 0
          fi
          EXTRA=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then EXTRA="$EXTRA --dry-run"; fi
          if [ -n "${{ inputs.slot }}" ]; then EXTRA="$EXTRA --slot ${{ inputs.slot }}"; fi
          python main.py --loop 1 --yes $EXTRA
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-log-${{ github.run_id }}
          path: logs/
          retention-days: 14
      # Fallback notice: posting failures exit non-zero, landing here. One
      # rolling issue (label: loop-alert) collects every incident so failures
      # are visible without digging through run logs.
      - name: File failure notice
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'loop-alert';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const stamp = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
            const body = `**Loop 1 (POST) failed** at ${stamp}.\n\n` +
              `- Run: ${runUrl}\n- The run log artifact (post-log-${context.runId}) has the full detail — ` +
              `look for \`FAILED on\` / \`PARTIAL on\` lines.\n\n` +
              `Common causes: X 402 (monthly post cap reached — upgrade tier or wait for reset), ` +
              `X 403 (17-posts/24h free-tier cap or duplicate content), ` +
              `Threads 4xx/5xx on publish, expired THREADS_ACCESS_TOKEN (~60 days).`;
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 1,
            });
            if (issues.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issues[0].number, body });
            } else {
              await github.rest.issues.create({
                ...context.repo, labels: [label],
                title: '🚨 LOOP posting failures — rolling incident log',
                body: 'Automated alerts from the POST/LEARN workflows. Close after fixing; a new one is opened on the next failure.\n\n' + body,
              });
            }
